<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>室内设计平面图 - 何强作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary:#1a1a2e;
            --secondary:#f8f9fa;
            --accent:#ff5722;
            --text:#333;
            --text-light:#666;
            --white:#fff;
            --border:#e0e0e0;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{font-family:Noto Sans SC,sans-serif;color:var(--text);background:var(--white);line-height:1.6;}
        nav{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);padding:1.5rem 5%;display:flex;justify-content:space-between;align-items:center;z-index:1000;box-shadow:0 2px 20px rgba(0,0,0,0.05);}
        .logo{font-family:Space Grotesk,sans-serif;font-weight:700;font-size:1.5rem;color:var(--primary);}
        .logo span{color:var(--accent);}
        .nav-links{display:flex;gap:2rem;list-style:none;}
        .nav-links a{text-decoration:none;color:var(--text);font-weight:500;transition:color .3s ease;position:relative;}
        .nav-links a::after{content:"";position:absolute;bottom:-5px;left:0;width:0;height:2px;background:var(--accent);transition:width .3s ease;}
        .nav-links a:hover{color:var(--accent);}
        .nav-links a:hover::after{width:100%;}
        .btn{display:inline-block;padding:1rem 2.5rem;background:var(--accent);color:var(--white);text-decoration:none;border-radius:50px;font-weight:600;transition:all .3s ease;border:none;cursor:pointer;}
        .btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,87,34,0.4);}
        .hero{padding-top:120px;background:var(--secondary);}
        .hero-content{max-width:1200px;margin:0 auto;padding:0 5%;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;}
        .hero-text h1{font-family:Space Grotesk,sans-serif;font-size:3rem;color:var(--primary);margin-bottom:1rem;}
        .hero-text .category{display:inline-block;background:var(--accent);color:var(--white);padding:.5rem 1.5rem;border-radius:50px;margin-bottom:1rem;}
        .hero-text p{color:var(--text-light);font-size:1.1rem;line-height:1.8;}
        .hero-image img{width:100%;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
        .section{padding:5rem 5%;}
        .section-header{text-align:center;margin-bottom:4rem;}
        .section-title{font-family:Space Grotesk,sans-serif;font-size:2.5rem;color:var(--primary);}
        .content-section{max-width:900px;margin:0 auto;}
        .content-section p{font-size:1.1rem;color:var(--text);line-height:2;margin-bottom:2rem;}
        .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem;max-width:1200px;margin:0 auto;}
        .gallery-item{border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.08);transition:transform .3s ease;}
        .gallery-item:hover{transform:scale(1.02);}
        .gallery-item img{width:100%;height:300px;object-fit:cover;}
        .back-btn{text-align:center;padding:3rem 5%;}
        footer{background:#111;color:rgba(255,255,255,0.6);padding:3rem 5%;text-align:center;}
        .copyright{font-size:.9rem;}
        @media (max-width:1024px){
            .hero-content,.gallery{grid-template-columns:1fr;}
            .hero-text h1{font-size:2rem;}
        }
        @media (max-width:768px){
            .nav-links{display:none;}
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DESIGN<span>.</span>PORTFOLIO</div>
        <ul class="nav-links">
            <li><a href="index.html">← 返回首页</a></li>
        </ul>
    </nav>
    
    <div class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <span class="category">室内设计</span>
                <h1>室内设计平面图</h1>
                <p>室内设计的ca平面图</p>
            </div>
            <div class="hero-image">
                <img src="https://s3.bmp.ovh/2026/05/27/b5CVWe9d.png" alt="室内设计平面图">
            </div>
        </div>
    </div>
    
    <div class="section">
        <div class="content-section">
            <p>该户型为三室两厅两卫格局，布局规整通透，动静分区合理。双卫设计提升居家便利性，多卧室保障居住需求，空间利用率高，采光条件佳，适配日常家庭居住。</p>
            <p>设计亮点：采用现代简约风格，色彩搭配温馨舒适。合理规划储物空间，提高生活便利性。注重空间层次感，通过家具摆放和软装搭配营造舒适的居住氛围。</p>
        </div>
    </div>
    
    <div class="section" style="background:var(--secondary);">
        <div class="section-header">
            <h2 class="section-title">项目图片</h2>
        </div>
        <div class="gallery">
            <div class="gallery-item"><img src="https://s3.bmp.ovh/2026/05/27/b5CVWe9d.png" alt="图片1"></div>
            <div class="gallery-item"><img src="https://s3.bmp.ovh/2026/05/27/b5CVWe9d.png" alt="图片2"></div>
        </div>
    </div>
    
    <div class="back-btn">
        <a href="index.html" class="btn">← 返回首页</a>
    </div>
    
    <footer>
        <div class="copyright">© 2025 何强. All Rights Reserved.</div>
    </footer>
</body>
</html>
